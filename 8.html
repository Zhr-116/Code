<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>素描绘馆 · 质感画板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1e24;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            touch-action: none;
        }

        .canvas-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 82px;
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        canvas {
            display: block;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            cursor: crosshair;
            background: white;
            border-radius: 20px;
            width: auto;
            height: auto;
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 32, 40, 0.94);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 240, 180, 0.25);
            padding: 8px 12px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 10px;
            z-index: 200;
            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.15);
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .toolbar::-webkit-scrollbar {
            height: 3px;
        }

        .tool-group {
            background: rgba(20, 25, 32, 0.65);
            border-radius: 44px;
            padding: 5px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .brush-icon, .color-dot, .action-btn, .bg-btn, .eraser-btn, .history-color {
            width: 40px;
            height: 40px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.07s linear;
            background: rgba(230, 240, 250, 0.2);
            border: 1px solid rgba(255, 240, 180, 0.4);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            flex-shrink: 0;
            color: #f5f0e0;
        }

        .brush-icon.active, .eraser-btn.active {
            background: #ffd89a;
            border-color: #ffb65b;
            color: #2a2a2a;
            transform: scale(1.02);
        }

        .color-dot, .history-color {
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgba(255,255,200,0.8);
        }
        .color-dot.active {
            transform: scale(1.1);
            border-color: #fff0c0;
            box-shadow: 0 0 10px #ffc285;
        }
        .history-color {
            width: 34px;
            height: 34px;
        }

        .custom-color-wrap {
            width: 40px;
            height: 40px;
        }
        .custom-color {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,200,0.8);
            cursor: pointer;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 36px;
        }
        .size-control span {
            font-size: 11px;
            color: #ffefcf;
            font-weight: 500;
        }
        input[type="range"] {
            width: 100px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbdae9;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffbc6e;
            border: 1px solid white;
            cursor: pointer;
        }

        .action-btn {
            background: #5f7f6e;
        }

        .info-tip {
            position: fixed;
            bottom: 92px;
            left: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 32px;
            font-size: 10px;
            color: #eef3fc;
            pointer-events: none;
            z-index: 99;
            white-space: nowrap;
            font-weight: 400;
        }

        @media (max-width: 700px) {
            .canvas-wrapper { bottom: 76px; }
            .toolbar { padding: 6px 10px; gap: 8px; }
            .brush-icon, .color-dot, .action-btn, .bg-btn, .eraser-btn { width: 38px; height: 38px; font-size: 13px; }
            .history-color { width: 32px; height: 32px; }
            .size-control span { font-size: 10px; }
            input[type="range"] { width: 85px; }
            .info-tip { bottom: 86px; font-size: 9px; }
        }
    </style>
</head>
<body>
<div class="canvas-wrapper">
    <canvas id="sketchCanvas"></canvas>
</div>
<div class="toolbar">
    <div class="tool-group">
        <div class="brush-icon active" data-brush="watercolor">水彩</div>
        <div class="brush-icon" data-brush="chineseBrush">毛笔</div>
        <div class="brush-icon" data-brush="crayon">蜡笔</div>
        <div class="brush-icon" data-brush="rainbow">彩虹</div>
        <div class="brush-icon" data-brush="spray">喷枪</div>
        <div class="brush-icon" data-brush="marker">马克笔</div>
    </div>
    <div class="tool-group">
        <div class="color-dot" style="background: #2c2c2e;" data-color="#2c2c2e"></div>
        <div class="color-dot" style="background: #d9733d;" data-color="#d9733d"></div>
        <div class="color-dot" style="background: #4d7c8c;" data-color="#4d7c8c"></div>
        <div class="color-dot" style="background: #a8786a;" data-color="#a8786a"></div>
        <div class="color-dot" style="background: #6a9e7b;" data-color="#6a9e7b"></div>
        <div class="color-dot active" style="background: #f3b33d;" data-color="#f3b33d"></div>
        <div class="custom-color-wrap">
            <input type="color" id="customColorPicker" class="custom-color" value="#f3b33d">
        </div>
    </div>
    <!-- 颜色历史区域 -->
    <div class="tool-group" id="colorHistoryGroup">
        <span style="font-size:10px; color:#ddd; margin-right:4px;">最近</span>
        <!-- 动态生成5个历史色块 -->
    </div>
    <div class="tool-group">
        <div class="eraser-btn" id="eraserBtn">橡皮</div>
    </div>
    <div class="tool-group">
        <div class="size-control">
            <span>大小</span>
            <input type="range" id="brushSizeSlider" min="3" max="52" value="18" step="1">
            <span id="sizeValue" style="min-width: 26px;">18</span>
        </div>
    </div>
    <div class="tool-group">
        <div class="bg-btn" id="bgColorBtn" style="background: #fdf4e0;">背景</div>
        <input type="color" id="bgColorPicker" value="#ffffff" style="width: 40px; height: 40px; border-radius: 36px; border: 2px solid rgba(255,255,200,0.8); background: white;">
    </div>
    <div class="tool-group">
        <div class="action-btn" id="undoBtn">↩️</div>
        <div class="action-btn" id="redoBtn">↪️</div>
        <div class="action-btn" id="clearCanvasBtn">清空</div>
        <div class="action-btn" id="saveCanvasBtn">保存</div>
    </div>
</div>
<div class="info-tip">
  毛笔有笔锋 · 水彩晕染 · 撤销/重做 · 颜色历史
</div>

<script>
    (function(){
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth = 0, canvasHeight = 0;
        let drawing = false;
        let lastX = 0, lastY = 0;
        let lastTime = 0;
        let currentBrush = 'watercolor';
        let currentColor = '#f3b33d';
        let brushSize = 18;
        let eraserMode = false;
        let rainbowHue = 0;
        let currentBgColor = '#ffffff';
        
        // ---------- 历史记录 (简化可靠版) ----------
        let undoStack = [];    // 存储 Image 快照
        let redoStack = [];
        const MAX_HISTORY = 50;
        let saveTimer = null;
        
        // 获取当前画布快照
        function captureSnapshot() {
            if (canvasWidth === 0) return null;
            const off = document.createElement('canvas');
            off.width = canvasWidth;
            off.height = canvasHeight;
            const offCtx = off.getContext('2d');
            offCtx.drawImage(canvas, 0, 0);
            return off;
        }
        
        // 从快照恢复
        function restoreFromSnapshot(snapshot) {
            if (!snapshot) return;
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(snapshot, 0, 0);
        }
        
        // 保存当前状态到撤销栈（无条件保存，每次绘画结束调用）
        function saveToUndo() {
            // 清除之前的延迟保存
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                const snapshot = captureSnapshot();
                if (!snapshot) return;
                undoStack.push(snapshot);
                if (undoStack.length > MAX_HISTORY) undoStack.shift();
                // 新状态加入后清空重做栈
                redoStack = [];
                saveTimer = null;
            }, 30);
        }
        
        // 立即保存（用于清空、换背景等操作）
        function saveToUndoImmediate() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                saveTimer = null;
            }
            const snapshot = captureSnapshot();
            if (!snapshot) return;
            undoStack.push(snapshot);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
        }
        
        function undo() {
            if (undoStack.length <= 1) return;  // 至少保留一个初始状态
            // 当前状态推入重做栈
            const current = captureSnapshot();
            if (current) redoStack.push(current);
            // 弹出上一个状态并恢复
            const prev = undoStack.pop();
            restoreFromSnapshot(prev);
        }
        
        function redo() {
            if (redoStack.length === 0) return;
            const next = redoStack.pop();
            const current = captureSnapshot();
            if (current) undoStack.push(current);
            restoreFromSnapshot(next);
        }
        
        // 初始化空白状态
        function initHistory() {
            saveToUndoImmediate(); // 空白状态入栈
        }
        
        // 绘画结束时调用
        function onDrawEnd() {
            if (drawing) {
                drawing = false;
                saveToUndo();  // 一笔画结束保存状态
            }
        }
        
        // 清空画布（保留背景色）
        function clearCanvas() {
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            saveToUndoImmediate();
        }
        
        // 更换背景色（保留绘画内容）
        function setBackgroundColor(newColor) {
            if (newColor === currentBgColor) return;
            const snap = captureSnapshot();
            currentBgColor = newColor;
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            if (snap) ctx.drawImage(snap, 0, 0);
            saveToUndoImmediate();
        }
        
        // ---------- 颜色历史 ----------
        let colorHistory = ['#f3b33d'];
        function addColorToHistory(color) {
            if (!color) return;
            const idx = colorHistory.indexOf(color);
            if (idx !== -1) colorHistory.splice(idx, 1);
            colorHistory.unshift(color);
            if (colorHistory.length > 5) colorHistory.pop();
            renderColorHistory();
        }
        
        function renderColorHistory() {
            const container = document.getElementById('colorHistoryGroup');
            if (!container) return;
            const span = container.querySelector('span');
            container.innerHTML = '';
            container.appendChild(span);
            colorHistory.forEach(color => {
                const div = document.createElement('div');
                div.className = 'history-color';
                div.style.background = color;
                div.setAttribute('data-color', color);
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (eraserMode) return;
                    currentColor = color;
                    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                    document.getElementById('customColorPicker').value = color;
                    addColorToHistory(color);
                });
                container.appendChild(div);
            });
        }
        
        // ---------- 笔刷核心（保持原有质感）----------
        function getRainbowColor() {
            const hue = rainbowHue % 360;
            rainbowHue = (rainbowHue + 6) % 360;
            return `hsl(${hue}, 80%, 65%)`;
        }
        
        function drawWatercolor(x, y, size, color) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.85, size * 0.7, 0, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 0.25;
            for(let i=0;i<3;i++) {
                let offX = (Math.random() - 0.5) * size * 0.65;
                let offY = (Math.random() - 0.5) * size * 0.65;
                ctx.beginPath();
                ctx.ellipse(x + offX, y + offY, size * 0.6, size * 0.55, 0, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.45, size * 0.4, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawChineseBrush(x, y, size, color, speed, angle) {
            ctx.save();
            ctx.globalAlpha = 0.88;
            let dynamicSize = size * Math.max(0.4, Math.min(1.0, 1.0 - speed * 0.7));
            dynamicSize = Math.max(4, dynamicSize);
            const major = dynamicSize * 0.95;
            const minor = dynamicSize * 0.55;
            ctx.beginPath();
            ctx.ellipse(x, y, major, minor, angle, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 0.45;
            for(let i=0;i<4;i++) {
                ctx.beginPath();
                ctx.arc(x + (Math.random()-0.5)*dynamicSize*0.8, y + (Math.random()-0.5)*dynamicSize*0.7, dynamicSize*0.12, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }
        
        function drawCrayon(x, y, size, color) {
            ctx.save();
            ctx.globalAlpha = 0.92;
            const grain = Math.floor(size * 1.2);
            for(let i=0;i<grain;i++) {
                let offX = (Math.random() - 0.5) * size;
                let offY = (Math.random() - 0.5) * size;
                ctx.beginPath();
                ctx.arc(x + offX, y + offY, Math.max(1.2, size * 0.12), 0, Math.PI*2);
                ctx.fillStyle = color + 'cc';
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(x, y, size * 0.48, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }
        
        function drawRainbow(x, y, size) {
            ctx.save();
            const points = 7 + Math.floor(size / 7);
            for(let i=0;i<points;i++) {
                let a = Math.random() * Math.PI * 2;
                let r = Math.random() * size * 0.85;
                let px = x + Math.cos(a) * r;
                let py = y + Math.sin(a) * r;
                ctx.beginPath();
                ctx.arc(px, py, size * 0.24, 0, Math.PI*2);
                ctx.fillStyle = getRainbowColor();
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(x, y, size * 0.4, 0, Math.PI*2);
            ctx.fillStyle = `hsl(${rainbowHue}, 85%, 70%)`;
            ctx.fill();
            ctx.restore();
        }
        
        function drawSpray(x, y, size, color) {
            ctx.save();
            const count = Math.floor(size * 2.2);
            for(let i=0;i<count;i++) {
                let a = Math.random() * Math.PI * 2;
                let r = Math.random() * size * 0.95;
                let px = x + Math.cos(a) * r;
                let py = y + Math.sin(a) * r;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(1, size * 0.1), 0, Math.PI*2);
                ctx.fillStyle = color + 'aa';
                ctx.fill();
            }
            ctx.restore();
        }
        
        function drawMarker(x, y, size, color) {
            ctx.save();
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.85, size * 0.65, 0.2, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.ellipse(x-2, y-1, size*0.4, size*0.3, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawEraser(x, y, size) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(x, y, size * 0.75, 0, Math.PI*2);
            ctx.fillStyle = currentBgColor;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x-1, y-1, size * 0.55, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawBrushDot(x, y, size, color, brush, isEraser, speed=0.3, angle=0) {
            if (isEraser) { drawEraser(x, y, size); return; }
            switch(brush) {
                case 'watercolor': drawWatercolor(x, y, size, color); break;
                case 'chineseBrush': drawChineseBrush(x, y, size, color, speed, angle); break;
                case 'crayon': drawCrayon(x, y, size, color); break;
                case 'rainbow': drawRainbow(x, y, size); break;
                case 'spray': drawSpray(x, y, size, color); break;
                case 'marker': drawMarker(x, y, size, color); break;
                default: drawWatercolor(x, y, size, color);
            }
        }
        
        function getSpeedAngle(x0,y0,x1,y1, dt) {
            const dx = x1-x0, dy = y1-y0;
            const dist = Math.hypot(dx,dy);
            const speed = dt>0 ? dist/dt : 0.2;
            const angle = Math.atan2(dy,dx);
            return { speed: Math.min(1.2, speed/9), angle };
        }
        
        function drawLineSeg(x0,y0,x1,y1, size, color, brush, isEraser, dt) {
            const dist = Math.hypot(x1-x0, y1-y0);
            if (dist < 0.8) {
                let sp=0.3, ang=0;
                if(brush==='chineseBrush' && !isEraser) { sp=0.3; }
                drawBrushDot(x0,y0,size,color,brush,isEraser,sp,ang);
                return;
            }
            const steps = Math.max(2, Math.floor(dist/2.2));
            for(let s=0;s<=steps;s++) {
                const t = s/steps;
                const cx = x0 + (x1-x0)*t;
                const cy = y0 + (y1-y0)*t;
                let sp=0.3, ang=0;
                if(brush==='chineseBrush' && !isEraser) {
                    ang = Math.atan2(y1-y0, x1-x0);
                    const spd = dt>0 ? dist/dt : 0.3;
                    sp = Math.min(1.0, spd/12);
                }
                drawBrushDot(cx,cy,size,color,brush,isEraser,sp,ang);
            }
        }
        
        function onDrawing(x, y, now) {
            if(!drawing) return;
            let dt = Math.max(1, now - lastTime);
            let finalColor = currentColor;
            if(currentBrush === 'rainbow' && !eraserMode) finalColor = getRainbowColor();
            drawLineSeg(lastX, lastY, x, y, brushSize, finalColor, currentBrush, eraserMode, dt);
            lastX = x; lastY = y; lastTime = now;
        }
        
        // 坐标转换（移动端适配）
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            let cx, cy;
            if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            let x = (cx - rect.left) * sx;
            let y = (cy - rect.top) * sy;
            x = Math.min(Math.max(x,0), canvas.width);
            y = Math.min(Math.max(y,0), canvas.height);
            return { x, y };
        }
        
        function start(e) {
            e.preventDefault();
            drawing = true;
            const {x,y} = getCoords(e);
            lastX = x; lastY = y;
            lastTime = performance.now();
            let col = currentColor;
            if(currentBrush==='rainbow' && !eraserMode) col = getRainbowColor();
            drawBrushDot(x,y,brushSize,col,currentBrush,eraserMode,0.3,0);
        }
        
        function move(e) {
            if(!drawing) return;
            e.preventDefault();
            const {x,y} = getCoords(e);
            onDrawing(x, y, performance.now());
        }
        
        function end(e) {
            if(drawing) {
                drawing = false;
                saveToUndo();  // 一笔画结束保存
            }
        }
        
        // 画布尺寸自适应（保持内容）
        function resizeCanvas() {
            const wrap = document.querySelector('.canvas-wrapper');
            const maxW = wrap.clientWidth - 24;
            const maxH = wrap.clientHeight - 24;
            const ratio = 4/3;
            let w = maxW;
            let h = w/ratio;
            if(h > maxH) { h = maxH; w = h*ratio; }
            w = Math.floor(w); h = Math.floor(h);
            if(w===canvasWidth && h===canvasHeight) return;
            const snap = captureSnapshot();
            canvasWidth = w; canvasHeight = h;
            canvas.width = w; canvas.height = h;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            if(snap) {
                ctx.fillStyle = currentBgColor;
                ctx.fillRect(0,0,w,h);
                ctx.drawImage(snap,0,0,w,h);
            } else {
                ctx.fillStyle = currentBgColor;
                ctx.fillRect(0,0,w,h);
            }
            // 尺寸改变保存状态
            saveToUndoImmediate();
        }
        
        // UI 绑定
        function setupUI() {
            const brushes = document.querySelectorAll('.brush-icon');
            brushes.forEach(b => {
                b.addEventListener('click', () => {
                    if(eraserMode) { eraserMode=false; document.getElementById('eraserBtn').classList.remove('active'); }
                    brushes.forEach(i=>i.classList.remove('active'));
                    b.classList.add('active');
                    currentBrush = b.getAttribute('data-brush');
                });
            });
            const eraser = document.getElementById('eraserBtn');
            eraser.addEventListener('click', () => {
                eraserMode = !eraserMode;
                if(eraserMode) {
                    eraser.classList.add('active');
                    brushes.forEach(i=>i.classList.remove('active'));
                } else {
                    eraser.classList.remove('active');
                    document.querySelector(`.brush-icon[data-brush="${currentBrush}"]`).classList.add('active');
                }
            });
            const colorDots = document.querySelectorAll('.color-dot');
            const customPick = document.getElementById('customColorPicker');
            colorDots.forEach(d => {
                d.addEventListener('click', () => {
                    if(eraserMode) return;
                    colorDots.forEach(c=>c.classList.remove('active'));
                    d.classList.add('active');
                    currentColor = d.getAttribute('data-color');
                    customPick.value = currentColor;
                    addColorToHistory(currentColor);
                });
            });
            customPick.addEventListener('input', (e) => {
                if(eraserMode) return;
                currentColor = e.target.value;
                colorDots.forEach(c=>c.classList.remove('active'));
                addColorToHistory(currentColor);
            });
            const sizeSlider = document.getElementById('brushSizeSlider');
            const sizeVal = document.getElementById('sizeValue');
            sizeSlider.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                sizeVal.innerText = brushSize;
            });
            const bgPicker = document.getElementById('bgColorPicker');
            bgPicker.addEventListener('input', (e) => setBackgroundColor(e.target.value));
            document.getElementById('bgColorBtn').addEventListener('click', () => bgPicker.click());
            document.getElementById('clearCanvasBtn').addEventListener('click', () => clearCanvas());
            document.getElementById('saveCanvasBtn').addEventListener('click', () => {
                try {
                    let a = document.createElement('a');
                    a.download = `sketch_${Date.now()}.png`;
                    a.href = canvas.toDataURL();
                    a.click();
                } catch(e) {}
            });
            document.getElementById('undoBtn').addEventListener('click', () => undo());
            document.getElementById('redoBtn').addEventListener('click', () => redo());
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.ctrlKey && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            });
        }
        
        function init() {
            resizeCanvas();
            setupUI();
            initHistory();      // 初始空白状态入栈
            renderColorHistory();
            addColorToHistory(currentColor);
            
            canvas.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            canvas.addEventListener('touchstart', start, {passive:false});
            canvas.addEventListener('touchmove', move, {passive:false});
            canvas.addEventListener('touchend', end);
            canvas.addEventListener('touchcancel', end);
            canvas.addEventListener('dragstart', e=>e.preventDefault());
            let tid;
            window.addEventListener('resize', () => { clearTimeout(tid); tid = setTimeout(resizeCanvas, 150); });
        }
        init();
    })();
</script>
</body>
</html>
