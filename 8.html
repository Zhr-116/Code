<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>流光画境 · 幻彩工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a262f;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system;
            touch-action: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* 半透明控制台 — 精致且不影响沉浸 */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 45, 55, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            z-index: 100;
            border: 1px solid rgba(255, 240, 180, 0.35);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            align-items: center;
            justify-content: flex-end;
        }

        .tool-group {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 12px;
            border-radius: 50px;
        }

        .color-dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 250, 200, 0.7);
            transition: 0.08s linear;
        }

        .color-dot.active {
            transform: scale(1.15);
            border-color: #fff0b5;
            box-shadow: 0 0 10px rgba(255, 200, 100, 0.6);
        }

        .custom-color {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: transparent;
        }

        .brush-btn {
            background: #3f6e7e;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.05s;
            font-family: inherit;
        }

        .brush-btn.active {
            background: #ffb347;
            color: #1f2f38;
            box-shadow: 0 0 8px #ffb347;
        }

        button {
            background: #2d5b68;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #f0f6fa;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.7rem;
            transition: 0.05s;
        }

        button:active {
            transform: scale(0.94);
        }

        .info-tip {
            position: fixed;
            bottom: 22px;
            left: 20px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            padding: 5px 16px;
            border-radius: 50px;
            font-size: 0.65rem;
            color: #eef3fc;
            pointer-events: none;
            z-index: 99;
            letter-spacing: 0.3px;
        }

        @media (max-width: 650px) {
            .control-panel { padding: 6px 12px; gap: 8px; bottom: 14px; right: 14px; }
            .color-dot { width: 30px; height: 30px; }
            .brush-btn { padding: 4px 10px; font-size: 0.65rem; }
            button { padding: 4px 10px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>
<canvas id="magicCanvas"></canvas>
<div class="control-panel">
    <div class="tool-group">
        <div class="color-dot" style="background: #ffb347;" data-color="#ffb347"></div>
        <div class="color-dot" style="background: #6cd4ff;" data-color="#6cd4ff"></div>
        <div class="color-dot" style="background: #d98cff;" data-color="#d98cff"></div>
        <div class="color-dot" style="background: #8affc4;" data-color="#8affc4"></div>
        <div class="color-dot" style="background: #ff9f6e;" data-color="#ff9f6e"></div>
        <div class="color-dot" style="background: #f7da7c;" data-color="#f7da7c"></div>
        <input type="color" id="customColorPicker" class="custom-color" value="#ffb347">
    </div>
    <div class="tool-group">
        <button class="brush-btn active" data-brush="flower">🌸 繁花</button>
        <button class="brush-btn" data-brush="stardust">✨ 星尘</button>
        <button class="brush-btn" data-brush="ribbon">🎀 流光</button>
    </div>
    <div class="tool-group">
        <button id="changeBgBtn">🌈 换背景</button>
        <button id="clearBtn">🍃 新生</button>
    </div>
</div>
<div class="info-tip">
    💫 点按开花 · 拖曳留痕 · 笔刷自由切换 · 背景八色轮转
</div>

<script>
    (function(){
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let elements = [];
        let currentColor = '#ffb347';
        let currentBrush = 'flower';   // flower, stardust, ribbon
        let drawing = false;
        let bgIndex = 0;
        // 8种纯色高级背景（饱和度舒适，有特色但不刺眼）
        const bgPalette = [
            '#f7f0e6',  // 米白暖意
            '#d9e8f0',  // 雾蓝
            '#e2dfe8',  // 淡紫灰
            '#cfe8db',  // 薄荷奶绿
            '#ffe6d5',  // 杏仁色
            '#d6e4f0',  // 晴空
            '#f5e3e0',  // 樱花粉白
            '#e0e7f5'   // 清透蓝
        ];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            redrawAll();
        }

        // 绘制花朵 (轻盈且有空气感)
        function drawFlower(x, y, color, size) {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = color + 'aa';
            const petalCount = 6 + Math.floor(Math.random() * 4);
            for(let i=0;i<petalCount;i++) {
                const angle = i * Math.PI * 2 / petalCount;
                const px = x + Math.cos(angle) * size * 0.9;
                const py = y + Math.sin(angle) * size * 0.75;
                ctx.beginPath();
                ctx.ellipse(px, py, size*0.65, size*0.5, angle, 0, Math.PI*2);
                ctx.fillStyle = color + 'dd';
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(x, y, size*0.4, 0, Math.PI*2);
            ctx.fillStyle = '#fff5cf';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x-2, y-2, size*0.12, 0, Math.PI*2);
            ctx.fillStyle = '#ffbc6e';
            ctx.fill();
            ctx.restore();
        }

        // 星尘粒子 + 光晕
        function drawStardust(x, y, color, rad) {
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(x, y, rad, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            for(let i=0;i<3;i++) {
                const angle = i * Math.PI * 2 / 3;
                const dx = Math.cos(angle) * rad * 1.6;
                const dy = Math.sin(angle) * rad * 1.6;
                ctx.beginPath();
                ctx.moveTo(x+dx*0.4, y+dy*0.4);
                ctx.lineTo(x+dx, y+dy);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = color;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 流光笔触 (柔光带状)
        function drawRibbon(x, y, color, size) {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = color + 'aa';
            ctx.beginPath();
            for(let i=0;i<5;i++) {
                const angle = Math.random() * Math.PI * 2;
                const offX = Math.cos(angle) * size * 1.2;
                const offY = Math.sin(angle) * size * 0.8;
                ctx.moveTo(x, y);
                ctx.lineTo(x + offX, y + offY);
                ctx.lineWidth = 3 + Math.random() * 4;
                ctx.strokeStyle = color + 'cc';
                ctx.stroke();
            }
            ctx.restore();
        }

        function addElement(x, y, type) {
            if(x<0 || y<0 || x>width || y>height) return;
            let size, newType = type;
            if(type === 'flower') size = 9 + Math.random() * 11;
            else if(type === 'stardust') size = 3 + Math.random() * 5;
            else size = 5 + Math.random() * 7;
            elements.push({ x, y, color: currentColor, size, type: newType });
            redrawAll();
            if(elements.length > 1100) elements = elements.slice(-900);
        }

        function redrawAll() {
            // 纯色背景 (用户可换)
            ctx.fillStyle = bgPalette[bgIndex];
            ctx.fillRect(0, 0, width, height);
            // 极细的几何装饰 (特色但不乱)
            ctx.globalAlpha = 0.12;
            for(let i=0;i<70;i++) {
                ctx.beginPath();
                ctx.arc((i*131)%width, (i*97)%height, 12, 0, Math.PI*2);
                ctx.fillStyle = '#aaccdd';
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            for(let e of elements) {
                if(e.type === 'flower') drawFlower(e.x, e.y, e.color, e.size);
                else if(e.type === 'stardust') drawStardust(e.x, e.y, e.color, e.size);
                else drawRibbon(e.x, e.y, e.color, e.size);
            }
        }

        function getCoords(e) {
            let cx, cy;
            if(e.touches) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            return { x: cx, y: cy };
        }

        function onStart(e) {
            e.preventDefault();
            drawing = true;
            const {x, y} = getCoords(e);
            addElement(x, y, currentBrush);
        }
        function onMove(e) {
            if(!drawing) return;
            e.preventDefault();
            const {x, y} = getCoords(e);
            addElement(x, y, currentBrush);
        }
        function onEnd() { drawing = false; }

        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart);
        canvas.addEventListener('touchmove', onMove);
        canvas.addEventListener('touchend', onEnd);

        // 颜色控制
        const colorDots = document.querySelectorAll('.color-dot');
        const customPicker = document.getElementById('customColorPicker');
        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                colorDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                currentColor = dot.getAttribute('data-color');
                customPicker.value = currentColor;
            });
        });
        customPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            colorDots.forEach(d => d.classList.remove('active'));
        });
        if(colorDots.length) colorDots[0].classList.add('active');

        // 笔刷切换
        const brushBtns = document.querySelectorAll('.brush-btn');
        brushBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                brushBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBrush = btn.getAttribute('data-brush');
            });
        });

        // 换背景
        document.getElementById('changeBgBtn').addEventListener('click', () => {
            bgIndex = (bgIndex + 1) % bgPalette.length;
            redrawAll();
        });
        // 清空所有元素
        document.getElementById('clearBtn').addEventListener('click', () => {
            elements = [];
            redrawAll();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        resizeCanvas();
        // 初始没有杂乱元素，完全由用户创作
    })();
</script>
</body>
</html>
